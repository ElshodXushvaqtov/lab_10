name: tm_classifier
description: "Teachable Machine image classifier, fully offline."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1   # TensorFlow Lite interpreter
  image_picker: ^1.2.3      # camera and gallery
  image: ^4.9.1             # decode, crop and resize in pure Dart
  http: ^1.5.0              # download an image from a URL

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
